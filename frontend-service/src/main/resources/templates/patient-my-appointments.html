<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<title>MediRevolution | My Appointments</title>

	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="manifest" href="/manifest.json">

	<meta name="theme-color" content="#05285f">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

	<link th:href="@{/css/medirevolution.css}" rel="stylesheet">

	<link th:href="@{/css/module-shell.css}" rel="stylesheet">

</head>

<body class="dashboard-body saas-dashboard-body">

	<div th:replace="~{layout/saas-topnavbar :: saasTopnavbar}"></div>

	<div th:replace="~{layout/saas-sidebar :: saasSidebar}"></div>

	<main class="mr-main saas-main">

		<section class="mb-4">

			<div class="p-4 rounded-4 text-white" style="background:linear-gradient(135deg,#05285f,#08c7d4);">

				<div class="small text-uppercase fw-bold">
					Patient Portal
				</div>

				<h1 class="fw-bold mb-2">
					My Appointments
				</h1>

				<p class="mb-0 text-white-50">
					View your booked appointments,
					payment status and online meeting links.
				</p>

			</div>

		</section>

		<div id="msg"></div>

		<section class="mr-card">

			<div class="d-flex justify-content-between
                    align-items-center mb-3">

				<div>

					<small class="text-muted">
						Workspace
					</small>

					<h5 id="tenantNameText" class="fw-bold text-primary mb-0">
						Your Workspace
					</h5>

				</div>

				<button type="button" class="btn btn-outline-primary" onclick="loadMyPatientAppointments()">

					<i class="bi bi-arrow-clockwise me-1"></i>
					Refresh

				</button>

			</div>

			<div class="table-responsive">

				<table class="table table-hover align-middle">

					<thead>

						<tr>

							<th>Date</th>

							<th>Doctor</th>

							<th>Time</th>

							<th>Type</th>

							<th>Payment</th>

							<th>Status</th>

							<th>Meeting</th>

						</tr>

					</thead>

					<tbody id="patientAppointmentsBody">

						<tr>

							<td colspan="7" class="text-center py-5">

								Loading appointments...

							</td>

						</tr>

					</tbody>

				</table>

			</div>

		</section>

	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
	</script>

	<script th:src="@{/js/common-dashboard.js}">
	</script>

	<script th:src="@{/js/module-switch.js}">
	</script>

	<script th:src="@{/js/saas-auth-guard.js}">
	</script>

	<script th:src="@{/js/saas-patient-my-appointments.js?v=1}">
	</script>

	<script th:src="@{/js/pwa.js}">
	</script>

</body>

</html>
